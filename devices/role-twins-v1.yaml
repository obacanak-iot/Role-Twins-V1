substitutions:
  device_name: role-twins-v1
  friendly_name: Role Twins V1
  firmware_version: "1.0.1"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  project:
    name: obacanak.role_twins_v1
    version: "1.0.1"

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

http_request:
  verify_ssl: false

ota:
  - platform: esphome

  - platform: http_request

update:
  - platform: http_request
    name: "${friendly_name} Firmware Update"
    source: "https://raw.githubusercontent.com/obacanak-iot/Role-Twins-V1/main/manifest.json"

wifi:
  networks:
    - ssid: "BACANAK"
      password: "71747576ob"

    - ssid: "BACANAK_5G"
      password: "71747576ob"

  ap:
    ssid: "Role Twins V1 Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80

api:

improv_serial:

mqtt:
  broker: "192.168.1.53"
  username: "obacanak"
  password: "717475"

  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: role-twins-v1

text_sensor:
  - platform: template
    name: "${friendly_name} Firmware Version"
    id: firmware_version_sensor
    icon: "mdi:package-variant"
    update_interval: 60s
    lambda: |-
      return {"${firmware_version}"};

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s

button:
  - platform: restart
    name: "${friendly_name} Restart"

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200

switch:
  - platform: template
    name: "${friendly_name} ROLE1"
    id: role1
    optimistic: true

    turn_on_action:
      - uart.write: [0xA0, 0x01, 0x01, 0xA2]

    turn_off_action:
      - uart.write: [0xA0, 0x01, 0x00, 0xA1]

  - platform: template
    name: "${friendly_name} ROLE2"
    id: role2
    optimistic: true

    turn_on_action:
      - uart.write: [0xA0, 0x02, 0x01, 0xA3]

    turn_off_action:
      - uart.write: [0xA0, 0x02, 0x00, 0xA2]
