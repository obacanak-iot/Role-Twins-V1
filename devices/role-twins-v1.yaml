substitutions:
  device_name: role-twins-v1
  friendly_name: Role Twins V1

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0

ota:
  - platform: esphome
    password: "7bc4b341f891bfc0dfe4a3a48ed581f4"

wifi:
  networks:
    - ssid: "BACANAK"
      password: "71747576ob"

    - ssid: "BACANAK_5G"
      password: "71747576ob"

  ap:
    ssid: "Role Twins V1 Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80

mqtt:
  broker: "192.168.1.53"
  username: "obacanak"
  password: "717475"

  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: role-twins-v1

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200

switch:
  - platform: template
    name: "${friendly_name} ROLE1"
    id: role1
    optimistic: true

    turn_on_action:
      - uart.write: [0xA0, 0x01, 0x01, 0xA2]

    turn_off_action:
      - uart.write: [0xA0, 0x01, 0x00, 0xA1]

  - platform: template
    name: "${friendly_name} ROLE2"
    id: role2
    optimistic: true

    turn_on_action:
      - uart.write: [0xA0, 0x02, 0x01, 0xA3]

    turn_off_action:
      - uart.write: [0xA0, 0x02, 0x00, 0xA2]
