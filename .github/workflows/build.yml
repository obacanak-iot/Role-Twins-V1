name: Build ESPHome Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create secrets.yaml
        run: |
          cat <<EOF > secrets.yaml
          wifi_ssid_1: "${{ secrets.WIFI_SSID_1 }}"
          wifi_password_1: "${{ secrets.WIFI_PASSWORD_1 }}"

          wifi_ssid_2: "${{ secrets.WIFI_SSID_2 }}"
          wifi_password_2: "${{ secrets.WIFI_PASSWORD_2 }}"

          mqtt_broker: "${{ secrets.MQTT_BROKER }}"
          mqtt_username: "${{ secrets.MQTT_USERNAME }}"
          mqtt_password: "${{ secrets.MQTT_PASSWORD }}"

          ota_password: "${{ secrets.OTA_PASSWORD }}"
          EOF

      - name: Build Firmware
        uses: esphome/build-action@v6
        with:
          yaml-file: devices/role-twins-v1.yaml

      - name: Find Firmware
        run: find . -name "*.bin"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: role-twins-v1-firmware
          path: ./devices/.esphome/build/role-twins-v1/.pioenvs/role-twins-v1/firmware.factory.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Role Twins V1 Firmware Build ${{ github.run_number }}
          files: ./devices/.esphome/build/role-twins-v1/.pioenvs/role-twins-v1/firmware.factory.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        run: |
          VERSION=$(grep 'firmware_version:' devices/role-twins-v1.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          DOWNLOAD_URL="https://github.com/obacanak-iot/Role-Twins-V1/releases/download/build-${{ github.run_number }}/firmware.factory.bin"

          cat > manifest.json <<EOF
          {
            "name": "Role Twins V1",
            "version": "$VERSION",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP8266",
                "ota": {
                  "path": "$DOWNLOAD_URL",
                  "md5": ""
                }
              }
            ]
          }
          EOF

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifest.json
          git commit -m "Update manifest.json" || echo "No changes to commit"
          git push
